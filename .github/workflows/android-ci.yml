name: Android CI and Releases

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ '**' ]
    tags: [ '*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x Android/gradlew
      - name: Build and test
        run: |
          set -euo pipefail
          cd Android
          ./gradlew assembleDebug assembleRelease testDebugUnitTest
      - name: Build and sign release APK
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/signed"
          if [[ -n "${RELEASE_KEYSTORE_B64:-}" ]]; then
            : "${RELEASE_STORE_PASSWORD:?Missing ANDROID_RELEASE_KEYSTORE_PASSWORD}"
            : "${RELEASE_KEY_ALIAS:?Missing ANDROID_RELEASE_KEY_ALIAS}"
            : "${RELEASE_KEY_PASSWORD:?Missing ANDROID_RELEASE_KEY_PASSWORD}"
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            keystore="${RUNNER_TEMP}/release.keystore"
            ks_pass="$RELEASE_STORE_PASSWORD"; key_alias="$RELEASE_KEY_ALIAS"; key_pass="$RELEASE_KEY_PASSWORD"
          else
            ks="$HOME/.android/debug.keystore"
            mkdir -p "$(dirname "$ks")"
            if [[ ! -f "$ks" ]]; then
              keytool -genkeypair -keystore "$ks" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null
            fi
            keystore="$HOME/.android/debug.keystore"
            ks_pass=android; key_alias=androiddebugkey; key_pass=android
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          mapfile -t apks < <(find Android/app/build/outputs/apk/release -name '*.apk' -type f | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$build_tools/apksigner" sign --ks "$keystore" --ks-pass "pass:$ks_pass" --ks-key-alias "$key_alias" --key-pass "pass:$key_pass" "$apk"
            "$build_tools/apksigner" verify "$apk"
          done
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-apk'
          path: release
          merge-multiple: true
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release -type f -name '*.apk' -print | sort)
          test "${#apks[@]}" -gt 0
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${apks[@]}" --clobber
            else
              gh release create "$tag" "${apks[@]}" --verify-tag --generate-notes
            fi
          else
            short_sha="${GITHUB_SHA:0:12}"
            tag="ci-${short_sha}"
            gh release create "$tag" "${apks[@]}" --target "$GITHUB_SHA" --prerelease --title "CI build ${short_sha}" --notes "Automated debug APK for commit ${GITHUB_SHA}."
          fi
