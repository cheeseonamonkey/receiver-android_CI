name: Android CI and Releases

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ '**' ]
    tags: [ '*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x Android/gradlew
      - name: Build and test
        run: |
          set -euo pipefail
          cd Android
          ./gradlew assembleDebug testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: release
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release -type f -name '*.apk' -print | sort)
          test "${#apks[@]}" -gt 0
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${apks[@]}" --clobber
            else
              gh release create "$tag" "${apks[@]}" --verify-tag --generate-notes
            fi
          else
            short_sha="${GITHUB_SHA:0:12}"
            tag="ci-${short_sha}"
            gh release create "$tag" "${apks[@]}" --target "$GITHUB_SHA" --prerelease --title "CI build ${short_sha}" --notes "Automated debug APK for commit ${GITHUB_SHA}."
          fi
