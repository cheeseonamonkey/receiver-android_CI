plugins {
    id 'com.android.application'
}

android {
    def versionMajor = 3
    def versionMinor = 6
    def versionPatch = 0
    compileSdk = 37

    defaultConfig {
        applicationId = "org.opendroneid.android"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName = "${versionMajor}.${versionMinor}.${versionPatch}"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        def mapProperty = providers.gradleProperty("org.gradle.project.map")
        def useGoogleMaps = mapProperty.isPresent() && mapProperty.get() == "google_map"
        buildConfigField "boolean", "USE_GOOGLE_MAPS", useGoogleMaps.toString()
    }
    buildTypes {
        debug {
            versionNameSuffix = ".debug"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"
        }

        release {
            resValue "string", "app_version", "${defaultConfig.versionName}"
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
        resValues = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-Xlint:deprecation"
    }

    namespace = 'org.opendroneid.android'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.mikepenz:fastadapter:3.3.1'
    implementation 'com.mikepenz:fastadapter-commons:3.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'pub.devrel:easypermissions:3.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

//    The below if-else works, but will then fail to compile the AircraftMapView.java or
//    AircraftOsMapView.java file. How to properly variate this is unclear.
//    if (project.hasProperty('org.gradle.project.map')) {
        implementation 'com.google.android.gms:play-services-maps:19.2.0'
        implementation 'com.google.android.gms:play-services-location:21.3.0'
//    } else {
        implementation 'androidx.preference:preference:1.2.1'
        implementation 'org.osmdroid:osmdroid-android:6.1.20'
//    }
}
